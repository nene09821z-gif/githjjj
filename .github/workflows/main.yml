name: ChessPlus Android - Build APK and ZIP

on:
  push:
    branches: [main, master]
    tags: ['v*']
  pull_request:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: chessplus-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Test, build APK and package ZIP
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract ZIP and find Android project
        id: project
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p .ci-source

          ARCHIVE="$(find . -maxdepth 3 -type f \
            -iname 'ChessPlus-Android*.zip' \
            -not -path './.git/*' \
            -not -path './.ci-source/*' \
            -print -quit || true)"

          if [[ -n "$ARCHIVE" ]]; then
            echo "Extracting: $ARCHIVE"
            unzip -oq "$ARCHIVE" -d .ci-source
          fi

          PROJECT_DIR=""

          for candidate in \
            "." \
            "ChessPlus" \
            ".ci-source" \
            ".ci-source/ChessPlus" \
            ".ci-source/ChessPlus-Android" \
            ".ci-source/ChessPlus-Android/Source"
          do
            if [[ -f "$candidate/settings.gradle.kts" || \
                  -f "$candidate/settings.gradle" ]]; then
              PROJECT_DIR="$candidate"
              break
            fi
          done

          if [[ -z "$PROJECT_DIR" ]]; then
            SETTINGS_FILE="$(find . -maxdepth 12 -type f \
              \( -name settings.gradle.kts -o -name settings.gradle \) \
              -not -path './.git/*' \
              -not -path '*/.gradle/*' \
              -not -path '*/build/*' \
              -print -quit || true)"

            if [[ -n "$SETTINGS_FILE" ]]; then
              PROJECT_DIR="$(dirname "$SETTINGS_FILE")"
            fi
          fi

          if [[ -z "$PROJECT_DIR" ]]; then
            echo "::error::Cannot find settings.gradle or settings.gradle.kts"
            echo "Repository files:"
            find . -maxdepth 6 -type f \
              -not -path './.git/*' | sort | head -250
            exit 1
          fi

          if [[ ! -f "$PROJECT_DIR/app/build.gradle.kts" && \
                ! -f "$PROJECT_DIR/app/build.gradle" ]]; then
            echo "::error::Android app module not found."
            exit 1
          fi

          echo "dir=$PROJECT_DIR" >> "$GITHUB_OUTPUT"
          echo "Project root: $PROJECT_DIR"
          ls -la "$PROJECT_DIR"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools platforms;android-36 build-tools;36.0.0'

      - name: Set up Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Configure Firebase
        working-directory: ${{ steps.project.outputs.dir }}
        env:
          FIREBASE_CONFIG: ${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}
        shell: bash
        run: |
          set -euo pipefail

          if [[ -n "${FIREBASE_CONFIG:-}" ]]; then
            mkdir -p app
            printf '%s' "$FIREBASE_CONFIG" |
              base64 --decode > app/google-services.json
            python3 -m json.tool app/google-services.json > /dev/null
            echo "Firebase configured."
          else
            echo "Firebase not configured. Offline build."
          fi

      - name: Run unit tests
        working-directory: ${{ steps.project.outputs.dir }}
        run: |
          gradle --no-daemon --stacktrace :app:testDebugUnitTest

      - name: Build debug APK
        working-directory: ${{ steps.project.outputs.dir }}
        run: |
          gradle --no-daemon --stacktrace :app:assembleDebug

      - name: Verify and package APK
        working-directory: ${{ steps.project.outputs.dir }}
        shell: bash
        run: |
          set -euo pipefail

          APK="app/build/outputs/apk/debug/app-debug.apk"

          if [[ ! -s "$APK" ]]; then
            echo "::error::APK was not generated."
            exit 1
          fi

          rm -rf release ChessPlus-Android.zip

          mkdir -p release/ChessPlus-Android/APK
          mkdir -p release/ChessPlus-Android/Source

          rsync -a ./ release/ChessPlus-Android/Source/ \
            --exclude='/.git/' \
            --exclude='/.gradle/' \
            --exclude='/release/' \
            --exclude='**/.gradle/**' \
            --exclude='**/build/**' \
            --exclude='/app/google-services.json' \
            --exclude='**/local.properties'

          cp "$APK" \
            release/ChessPlus-Android/APK/ChessPlus-debug.apk

          if [[ -f README.md ]]; then
            cp README.md release/ChessPlus-Android/
          fi

          if [[ -f BUILDING.md ]]; then
            cp BUILDING.md release/ChessPlus-Android/
          fi

          {
            echo "Project: ChessPlus Android"
            echo "Application ID: com.example.chessplus"
            echo "Build type: Debug"
            echo "Commit: ${GITHUB_SHA}"
            echo "Branch: ${GITHUB_REF_NAME}"
            echo "Run: ${GITHUB_RUN_NUMBER}"
            echo "Built: $(date -u '+%Y-%m-%d %H:%M:%S UTC')"
          } > release/ChessPlus-Android/BUILD_INFO.txt

          (
            cd release/ChessPlus-Android
            sha256sum APK/ChessPlus-debug.apk > SHA256SUMS.txt
          )

          (
            cd release
            zip -qr -9 ../ChessPlus-Android.zip ChessPlus-Android
          )

          test -s ChessPlus-Android.zip

          ls -lh "$APK" ChessPlus-Android.zip

      - name: Upload complete ZIP
        uses: actions/upload-artifact@v4
        with:
          name: ChessPlus-Android-ZIP
          path: ${{ steps.project.outputs.dir }}/ChessPlus-Android.zip
          if-no-files-found: error
          retention-days: 30

      - name: Upload APK separately
        uses: actions/upload-artifact@v4
        with:
          name: ChessPlus-debug-APK
          path: ${{ steps.project.outputs.dir }}/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
