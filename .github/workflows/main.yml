name: ChessPlus Android - Build APK and ZIP

on:
  push:
    branches:
      - main
      - master
    tags:
      - 'v*'
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: chessplus-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Test, build APK and package ZIP
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout source
        uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android SDK
        run: |
          sdkmanager --install \
            "platforms;android-36" \
            "build-tools;36.0.0" \
            "platform-tools"

      - name: Set up Gradle 8.13
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.13'

      - name: Configure Firebase (optional)
        env:
          GOOGLE_SERVICES_JSON_BASE64: ${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ -n "${GOOGLE_SERVICES_JSON_BASE64:-}" ]]; then
            printf '%s' "$GOOGLE_SERVICES_JSON_BASE64" |
              base64 --decode > app/google-services.json
            python -m json.tool app/google-services.json > /dev/null
          else
            echo "Building offline configuration."
          fi

      - name: Run unit tests
        run: gradle --no-daemon --stacktrace :app:testDebugUnitTest

      - name: Build APK
        run: gradle --no-daemon --stacktrace :app:assembleDebug

      - name: Package APK and source into ZIP
        shell: bash
        run: |
          set -euo pipefail

          APK_PATH="app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK_PATH"

          rm -rf release ChessPlus-Android.zip

          mkdir -p release/ChessPlus-Android/APK
          mkdir -p release/ChessPlus-Android/Source

          rsync -a ./ release/ChessPlus-Android/Source/ \
            --exclude='/.git/' \
            --exclude='/.gradle/' \
            --exclude='/release/' \
            --exclude='**/.gradle/**' \
            --exclude='**/build/**' \
            --exclude='/app/google-services.json' \
            --exclude='**/local.properties'

          cp "$APK_PATH" \
            release/ChessPlus-Android/APK/ChessPlus-debug.apk

          cp README.md BUILDING.md release/ChessPlus-Android/

          {
            echo "Project: ChessPlus Android"
            echo "Application ID: com.example.chessplus"
            echo "Version: 1.0.0"
            echo "Build type: debug"
            echo "Commit: ${GITHUB_SHA}"
            echo "Branch: ${GITHUB_REF_NAME}"
            echo "Run: ${GITHUB_RUN_NUMBER}"
            echo "Built: $(date -u '+%Y-%m-%d %H:%M:%S UTC')"
          } > release/ChessPlus-Android/BUILD_INFO.txt

          (
            cd release/ChessPlus-Android
            sha256sum APK/ChessPlus-debug.apk > SHA256SUMS.txt
          )

          (
            cd release
            zip -qr -9 ../ChessPlus-Android.zip ChessPlus-Android
          )

          ls -lh ChessPlus-Android.zip

      - name: Upload complete ZIP
        uses: actions/upload-artifact@v7
        with:
          name: ChessPlus-Android-ZIP
          path: ChessPlus-Android.zip
          if-no-files-found: error
          retention-days: 30

      - name: Upload standalone APK
        uses: actions/upload-artifact@v7
        with:
          name: ChessPlus-debug-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
          
